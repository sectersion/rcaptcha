<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>rcaptcha — reverse CAPTCHA</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-50 text-slate-900"><main class="mx-auto max-w-xl p-6"><div class="rounded-xl border bg-white p-6 shadow"><h1 class="text-2xl font-bold">rcaptcha</h1><p class="mt-2 text-sm">Short timed tasks language models do easily and humans find tedious. A fun reward for speed, <strong>not a bot filter</strong>.</p><div class="mt-4 flex gap-2"><select id="gate" aria-label="Gate" class="rounded border px-3 py-2"></select><button id="start" class="rounded bg-black px-4 py-2 text-white">Start challenge</button></div><p id="prompt" class="mt-4 whitespace-pre-wrap text-sm"></p><div class="mt-2 h-2 rounded bg-slate-200"><div id="bar" class="h-2 rounded bg-black" style="width:0%"></div></div><p id="count" aria-live="polite" class="text-xs mt-1"></p><label class="mt-4 block text-sm" for="answer">Answer</label><textarea id="answer" rows="5" class="w-full rounded border p-2"></textarea><button id="submit" class="mt-2 rounded bg-black px-4 py-2 text-white">Submit</button><div id="result" aria-live="polite" class="mt-4 text-sm"></div></div><section class="mt-6 text-sm"><h2 class="font-semibold">For agents</h2><p>MCP endpoint <code>/mcp</code> tools: list_gates, get_challenge, submit_answer.</p></section></main><script>const g=document.getElementById('gate');g.innerHTML='<option value="">random</option>';let token='',exp=0,timer=null;document.getElementById('start').onclick=async()=>{const r=await fetch('/api/challenge',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(g.value?{gate:g.value}:{})});const j=await r.json();token=j.token;document.getElementById('prompt').textContent=j.prompt;exp=new Date(j.expiresAt).getTime();clearInterval(timer);timer=setInterval(()=>{const left=Math.max(0,exp-Date.now());document.getElementById('count').textContent=(left/1000).toFixed(1)+'s left';document.getElementById('bar').style.width=(100*left/(60000))+'%';if(left<=0)clearInterval(timer);},100);};document.getElementById('submit').onclick=async()=>{const a=document.getElementById('answer').value;const r=await fetch('/api/answer',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,answer:a})});const j=await r.json();document.getElementById('result').textContent=JSON.stringify(j);token='';};</script></body></html>
